<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F6F2EA">
  <meta name="description" content="NEXO: tu dinero, pero con alguien de tu lado.">
  <title>Inicio · NEXO</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="pagina-app" data-pantalla="inicio">

  <div class="pantalla">
    <div class="pantalla__contenido">

      <header class="barra-pestana">
        <span class="logo logo--sm" role="img" aria-label="NEXO">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path class="logo__linea" d="M15 32L33 16" stroke-width="3.5" stroke-linecap="round"/><circle class="logo__nodo" cx="15" cy="32" r="5.5"/><circle class="logo__nodo logo__nodo--acento" cx="33" cy="16" r="5.5"/></svg>
        </span>
        <h1 class="logotipo">NEXO</h1>
        <span class="espaciador"></span>
        <a class="boton-icono" href="avisos.html" id="enlace-avisos" aria-label="Avisos">
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>
          <span class="contador" id="contador-avisos" hidden></span>
        </a>
        <a class="chip-racha" href="racha.html" aria-label="Ver mi racha">
          <svg class="icono icono--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
          <span id="racha-chip">0</span>
        </a>
        <a class="boton-icono" href="perfil.html" aria-label="Perfil">
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
        </a>
      </header>

      <main class="pila">

        <!-- Resumen del mes -->
        <section class="tarjeta tarjeta--oscura pila" aria-label="Resumen del mes">
          <div class="fila">
            <p class="texto-suave" id="resumen-titulo">Te quedan este mes</p>
            <span class="espaciador"></span>
            <button type="button" class="boton-icono boton-icono--compacto boton-icono--sobre-oscuro" id="boton-ojo" aria-pressed="false" aria-label="Ocultar montos"></button>
          </div>
          <span class="cifra cifra--xl" id="resumen-cifra"></span>
          <div class="barra-progreso barra-progreso--sobre-oscuro" id="resumen-barra" role="img" aria-label="Has gastado el 0% de tus ingresos">
            <span class="barra-progreso__relleno"></span>
          </div>
          <div class="fila">
            <div>
              <p class="texto-suave texto-pequeno">Gastado</p>
              <p class="titulo-tarjeta" id="resumen-gastado"></p>
            </div>
            <span class="espaciador"></span>
            <div>
              <div class="fila">
                <p class="texto-suave texto-pequeno">Puedes gastar al día</p>
                <button type="button" class="boton-icono boton-icono--compacto boton-icono--sobre-oscuro" id="boton-ayuda-calculo" aria-expanded="false" aria-controls="ayuda-calculo" aria-label="¿Cómo se calcula lo que puedes gastar al día?">?</button>
              </div>
              <p class="titulo-tarjeta" id="resumen-por-dia"></p>
            </div>
          </div>
          <p class="nota-ayuda nota-ayuda--oscura" id="ayuda-calculo" role="note" hidden></p>
        </section>

        <a class="boton boton--completo" href="registrar-gasto.html">
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          Registrar gasto de hoy
        </a>

        <!-- Mensaje de NEXO -->
        <section class="tarjeta pila" aria-label="Mensaje de NEXO">
          <div class="fila">
            <span class="logo logo--sm" role="img" aria-label="NEXO">
              <svg viewBox="0 0 48 48" aria-hidden="true"><path class="logo__linea" d="M15 32L33 16" stroke-width="3.5" stroke-linecap="round"/><circle class="logo__nodo" cx="15" cy="32" r="5.5"/><circle class="logo__nodo logo__nodo--acento" cx="33" cy="16" r="5.5"/></svg>
            </span>
            <span class="texto-ia">NEXO</span>
          </div>
          <p id="mensaje-nexo"></p>
        </section>

        <!-- Racha -->
        <section class="tarjeta tarjeta--acento pila" aria-label="Racha">
          <div class="fila fila--ajusta">
            <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
            <h2 class="titulo-tarjeta sin-salto" id="racha-titulo"></h2>
            <button type="button" class="boton-icono boton-icono--compacto" id="boton-ayuda-racha" aria-expanded="false" aria-controls="ayuda-racha" aria-label="¿Qué es la racha?">?</button>
            <a class="boton boton--texto boton--pequeno sin-salto al-extremo" href="racha.html">Ver racha</a>
          </div>
          <p class="nota-ayuda" id="ayuda-racha" role="note" hidden></p>
          <div class="racha-dias" id="racha-dias"></div>
        </section>

        <!-- Meta activa -->
        <section class="tarjeta pila" aria-label="Tu meta">
          <div class="fila">
            <h2 class="titulo-tarjeta">Tu meta</h2>
            <span class="espaciador"></span>
            <a class="boton boton--texto boton--pequeno" href="metas.html">Ver metas</a>
          </div>
          <div class="pila" id="meta-contenido"></div>
        </section>

        <!-- Últimos gastos -->
        <section class="tarjeta pila" aria-label="Últimos gastos">
          <div class="fila">
            <h2 class="titulo-tarjeta">Últimos gastos</h2>
            <span class="espaciador"></span>
            <a class="boton boton--texto boton--pequeno" href="gastos.html">Ver todos</a>
          </div>
          <div class="lista" id="lista-gastos"></div>
        </section>

      </main>
    </div>

    <nav class="navegacion" aria-label="Navegación principal">
      <a class="navegacion__item navegacion__item--activo" href="inicio.html" aria-current="page">
        <span class="navegacion__icono"><svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
        Inicio
      </a>
      <a class="navegacion__item" href="gastos.html">
        <span class="navegacion__icono"><svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg></span>
        Gastos
      </a>
      <a class="navegacion__item" href="copiloto.html">
        <span class="navegacion__logo">
          <span class="logo" aria-hidden="true">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path class="logo__linea" d="M15 32L33 16" stroke-width="3.5" stroke-linecap="round"/><circle class="logo__nodo" cx="15" cy="32" r="5.5"/><circle class="logo__nodo logo__nodo--acento" cx="33" cy="16" r="5.5"/></svg>
          </span>
        </span>
        Copiloto
      </a>
      <a class="navegacion__item" href="metas.html">
        <span class="navegacion__icono"><svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></span>
        Metas
      </a>
      <a class="navegacion__item" href="foro.html">
        <span class="navegacion__icono"><svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
        Comunidad
      </a>
    </nav>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
