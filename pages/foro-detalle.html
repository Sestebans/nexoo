<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F6F2EA">
  <meta name="description" content="NEXO: tu dinero, pero con alguien de tu lado.">
  <title>Pregunta · NEXO</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="pagina-app" data-pantalla="foro-detalle">

  <main class="pantalla">
    <div class="pantalla__contenido">

      <!-- F3.2 · Detalle de pregunta -->
      <section class="paso" id="paso-pregunta" aria-label="Pregunta" hidden>
        <header class="barra-interna">
          <a class="boton-icono" href="foro.html" aria-label="Volver a la comunidad">
            <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          </a>
          <h1 class="titulo-interno">Pregunta</h1>
        </header>

        <section class="tarjeta pila" aria-label="La pregunta">
          <div class="fila fila--ajusta" id="pregunta-autor"></div>
          <h2 class="titulo-interno" id="pregunta-titulo"></h2>
          <p id="pregunta-texto" hidden></p>
        </section>

        <section class="tarjeta pila" aria-label="Respuestas">
          <h2 class="titulo-tarjeta" id="respuestas-titulo"></h2>
          <p class="texto-suave texto-pequeno" id="sin-respuestas" hidden>Todavía nadie responde. Sé la primera persona.</p>
          <div class="lista" id="lista-respuestas"></div>
        </section>

        <form class="pila" id="formulario-respuesta" novalidate>
          <div class="alerta alerta--aviso" id="alerta-respuesta" role="alert" hidden>
            <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
            <span id="alerta-respuesta-texto"></span>
          </div>
          <label class="solo-lectores" for="campo-respuesta">Tu respuesta</label>
          <textarea class="campo campo--area" id="campo-respuesta" placeholder="Escribe tu respuesta…" aria-invalid="false"></textarea>
          <button type="submit" class="boton boton--completo">Responder</button>
        </form>
      </section>

      <!-- Si no existe la pregunta -->
      <section class="paso" id="paso-no-encontrada" aria-label="Pregunta no encontrada" hidden>
        <header class="barra-interna">
          <a class="boton-icono" href="foro.html" aria-label="Volver a la comunidad">
            <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          </a>
          <h1 class="titulo-interno">Pregunta</h1>
        </header>
        <div class="tarjeta tarjeta--vacia pila">
          <p>No encontré esa pregunta.</p>
          <a class="boton boton--secundario" href="foro.html">Volver a la comunidad</a>
        </div>
      </section>

    </div>
  </main>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
