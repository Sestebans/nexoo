<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F6F2EA">
  <meta name="description" content="NEXO: tu dinero, pero con alguien de tu lado.">
  <title>Gastos · NEXO</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="pagina-app" data-pantalla="gastos">

  <div class="pantalla">
    <div class="pantalla__contenido">

      <!-- Lista de gastos -->
      <header class="barra-pestana" id="barra-lista">
        <span class="logo logo--sm" role="img" aria-label="NEXO">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path class="logo__linea" d="M15 32L33 16" stroke-width="3.5" stroke-linecap="round"/><circle class="logo__nodo" cx="15" cy="32" r="5.5"/><circle class="logo__nodo logo__nodo--acento" cx="33" cy="16" r="5.5"/></svg>
        </span>
        <span class="logotipo">NEXO</span>
        <span class="espaciador"></span>
        <a class="boton-icono" href="avisos.html" id="enlace-avisos" aria-label="Avisos">
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>
          <span class="contador" id="contador-avisos" hidden></span>
        </a>
        <a class="chip-racha" href="racha.html" aria-label="Ver mi racha">
          <svg class="icono icono--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
          <span id="racha-chip">0</span>
        </a>
        <a class="boton-icono" href="perfil.html" aria-label="Perfil">
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
        </a>
      </header>

      <main class="pila" id="vista-lista">

        <div class="fila">
          <h1 class="titulo-interno">Gastos</h1>
          <span class="espaciador"></span>
          <a class="boton boton--pequeno" href="registrar-gasto.html">
            <svg class="icono icono--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            Registrar
          </a>
        </div>

        <div class="aviso-temporal" id="aviso-gastos" role="status" hidden>
          <span></span>
          <button type="button" class="aviso-temporal__accion" hidden></button>
        </div>

        <section class="tarjeta pila" id="tarjeta-mes" aria-labelledby="titulo-mes" hidden>
          <div class="fila">
            <h2 class="titulo-tarjeta" id="titulo-mes">Este mes</h2>
            <span class="espaciador"></span>
            <span class="cifra cifra--m" id="total-mes"></span>
          </div>
          <div class="pila" id="categorias-mes"></div>
        </section>

        <p class="texto-suave texto-pequeno" id="ayuda-gastos" hidden>Toca un gasto para editarlo o eliminarlo.</p>

        <div class="pila" id="lista-gastos"></div>

      </main>

      <!-- Editar gasto -->
      <form class="paso" id="vista-editar" novalidate hidden>
        <header class="barra-interna">
          <a class="boton-icono" href="#lista" aria-label="Volver a mis gastos">
            <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          </a>
          <h1 class="titulo-interno">Editar gasto</h1>
        </header>

        <div class="alerta alerta--aviso" id="alerta-monto" role="alert" hidden>
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
          <span>Revisa el monto. Debe ser un número mayor a cero.</span>
        </div>

        <div class="tarjeta pila" id="confirmar-monto" role="alertdialog" aria-labelledby="confirmar-titulo" hidden>
          <div class="alerta alerta--aviso">
            <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
            <span id="confirmar-titulo">Este monto es mayor que lo que recibes al mes</span>
          </div>
          <p id="confirmar-texto"></p>
          <div class="fila">
            <button type="button" class="boton boton--terciario boton--completo" id="boton-corregir">Corregir monto</button>
            <button type="button" class="boton boton--completo" id="boton-confirmar">Sí, guardar</button>
          </div>
        </div>

        <div class="grupo-campo">
          <label class="etiqueta-campo" for="campo-monto">Monto</label>
          <div class="campo-monto" id="contenedor-monto">
            <span class="campo-monto__simbolo">$</span>
            <input class="campo-monto__entrada" id="campo-monto" inputmode="numeric" autocomplete="off" placeholder="0" aria-invalid="false">
          </div>
        </div>

        <div class="grupo-campo" role="group" aria-labelledby="etiqueta-categoria">
          <span class="etiqueta-campo" id="etiqueta-categoria">Categoría</span>
          <div class="chips" id="chips-categoria"></div>
          <p class="mensaje-error" id="error-categoria" hidden>Elige una categoría.</p>
        </div>

        <div class="grupo-campo" role="group" aria-labelledby="etiqueta-cuando">
          <span class="etiqueta-campo" id="etiqueta-cuando">¿Cuándo fue?</span>
          <div class="chips" id="chips-cuando"></div>
        </div>

        <div class="grupo-campo">
          <label class="etiqueta-campo" for="campo-nota">Nota (opcional)</label>
          <input class="campo" id="campo-nota" autocomplete="off" placeholder="Ej. almuerzo con amigos">
        </div>

        <div class="paso__fondo">
          <button type="submit" class="boton boton--completo">Guardar cambios</button>
          <button type="button" class="boton boton--peligro boton--completo" id="boton-eliminar">Eliminar gasto</button>
        </div>
      </form>

    </div>

    <nav class="navegacion" id="navegacion" aria-label="Navegación principal">
      <a class="navegacion__item" href="inicio.html">
        <span class="navegacion__icono"><svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
        Inicio
      </a>
      <a class="navegacion__item navegacion__item--activo" href="gastos.html" aria-current="page">
        <span class="navegacion__icono"><svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg></span>
        Gastos
      </a>
      <a class="navegacion__item" href="copiloto.html">
        <span class="navegacion__logo">
          <span class="logo" aria-hidden="true">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path class="logo__linea" d="M15 32L33 16" stroke-width="3.5" stroke-linecap="round"/><circle class="logo__nodo" cx="15" cy="32" r="5.5"/><circle class="logo__nodo logo__nodo--acento" cx="33" cy="16" r="5.5"/></svg>
          </span>
        </span>
        Copiloto
      </a>
      <a class="navegacion__item" href="metas.html">
        <span class="navegacion__icono"><svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></span>
        Metas
      </a>
      <a class="navegacion__item" href="foro.html">
        <span class="navegacion__icono"><svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
        Comunidad
      </a>
    </nav>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
