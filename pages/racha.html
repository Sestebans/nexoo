<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F6F2EA">
  <meta name="description" content="NEXO: tu dinero, pero con alguien de tu lado.">
  <title>Racha y recompensas · NEXO</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="pagina-app" data-pantalla="racha">

  <main class="pantalla">
    <div class="pantalla__contenido">

      <header class="barra-interna">
        <a class="boton-icono" href="inicio.html" aria-label="Volver al inicio">
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        </a>
        <h1 class="titulo-interno">Racha y recompensas</h1>
      </header>

      <div class="aviso-temporal" id="aviso-racha" role="status" hidden>
        <span></span>
      </div>

      <!-- Racha actual -->
      <section class="tarjeta tarjeta--acento pila" aria-label="Racha actual">
        <div class="fila">
          <svg class="icono icono--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
          <h2 class="titulo-tarjeta">Racha actual</h2>
        </div>
        <div class="fila">
          <span class="cifra cifra--xl" id="racha-numero"></span>
          <span class="titulo-interno" id="racha-unidad"></span>
        </div>
        <div class="racha-dias" id="racha-dias"></div>
        <p class="texto-pequeno" id="racha-mejor"></p>
      </section>

      <!-- Plan Pro (solo si está activo) -->
      <section class="tarjeta pila" id="panel-pro" aria-label="Plan Pro" hidden>
        <div class="fila">
          <span class="insignia-pro">PRO</span>
          <span id="pro-texto"></span>
        </div>
        <p class="texto-suave texto-pequeno">Con Pro, el copiloto da un análisis más completo en cada respuesta.</p>
      </section>

      <!-- Recompensas -->
      <h2 class="titulo-interno">Recompensas</h2>
      <div class="pila" id="lista-recompensas"></div>

      <a class="boton boton--terciario boton--completo" href="copiloto.html" id="boton-consejo" hidden>Ver mi consejo en el copiloto</a>

    </div>
  </main>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
