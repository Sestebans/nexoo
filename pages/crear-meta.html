<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F6F2EA">
  <meta name="description" content="NEXO: tu dinero, pero con alguien de tu lado.">
  <title>Crear meta · NEXO</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="pagina-app" data-pantalla="crear-meta">

  <main class="pantalla">
    <div class="pantalla__contenido">

      <form class="paso" id="paso-crear" novalidate>
        <header class="barra-interna">
          <a class="boton-icono" href="metas.html" aria-label="Volver a mis metas">
            <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          </a>
          <h1 class="titulo-interno">Crear meta</h1>
        </header>

        <div class="grupo-campo">
          <label class="etiqueta-campo" for="campo-nombre">Nombre</label>
          <input class="campo" id="campo-nombre" autocomplete="off" placeholder="Ej. Viaje a Cartagena" aria-invalid="false">
          <p class="mensaje-error" id="error-nombre" hidden>Ponle un nombre a tu meta.</p>
        </div>

        <div class="chips chips--desliza" id="chips-ideas" role="group" aria-label="Ideas de meta"></div>

        <div class="grupo-campo">
          <label class="etiqueta-campo" for="campo-monto">¿Cuánto necesitas?</label>
          <input class="campo" id="campo-monto" inputmode="numeric" autocomplete="off" placeholder="$ 1.500.000" aria-invalid="false">
          <p class="mensaje-error" id="error-monto" hidden>Escribe cuánto necesitas.</p>
        </div>

        <div class="paso__fondo">
          <button type="submit" class="boton boton--completo">Crear meta</button>
        </div>
      </form>

    </div>
  </main>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
